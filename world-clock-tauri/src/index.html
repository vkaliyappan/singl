<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>World Clock</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="shell">
    <div id="card" class="card">
      <header class="bar">
        <span class="ico globe">&#xE774;</span>
        <span class="title" id="title">Around the world</span>
        <span class="spacer"></span>
        <button class="icon-btn" id="btnSettings" title="Settings">&#xE713;</button>
        <button class="icon-btn" id="btnPin"></button>
        <button class="icon-btn" id="btnMin" title="Minimize">&#xE921;</button>
      </header>

      <section id="clockView">
        <div id="rows"></div>
      </section>

      <section id="settingsView" class="settings" hidden>
        <div class="group">
          <div class="label">Pick a vibe</div>
          <div class="swatches" id="swatches"></div>
        </div>

        <div class="group">
          <div class="label">Clock</div>
          <div class="opt">
            <span>Time format</span>
            <div class="seg" data-key="use24h">
              <button data-val="false">12h</button><button data-val="true">24h</button>
            </div>
          </div>
          <label class="opt"><span>Show seconds</span><input type="checkbox" class="switch" data-key="showSeconds"></label>
          <label class="opt"><span>Date &amp; day progress</span><input type="checkbox" class="switch" data-key="showDetails"></label>
        </div>

        <div class="group">
          <div class="label">Size &amp; glass</div>
          <div class="opt">
            <span>Size</span>
            <div class="seg" data-key="scale">
              <button data-val="0.85">S</button><button data-val="1">M</button><button data-val="1.15">L</button><button data-val="1.3">XL</button>
            </div>
          </div>
          <div class="opt">
            <span>Opacity</span>
            <input type="range" id="opacity" min="0.5" max="1" step="0.05">
          </div>
        </div>

        <div class="group">
          <div class="label">Your crew around the globe</div>
          <div id="cityList"></div>
          <div class="add">
            <input id="newZone" list="zones" placeholder="Search a place, e.g. Paris" autocomplete="off" spellcheck="false">
            <div class="add-row">
              <input id="newLabel" placeholder="Nickname (optional)" autocomplete="off" spellcheck="false">
              <button id="btnAdd" class="primary">Add it!</button>
            </div>
            <div class="hint" id="addHint"></div>
            <datalist id="zones"></datalist>
          </div>
        </div>

        <div class="group">
          <div class="label">Window</div>
          <label class="opt"><span>Pin on top of other apps</span><input type="checkbox" class="switch" data-key="topmost"></label>
          <label class="opt"><span>Lock position</span><input type="checkbox" class="switch" data-key="locked"></label>
          <label class="opt"><span>Start with Windows</span><input type="checkbox" class="switch" id="autostart"></label>
        </div>

        <div class="footer">
          <button id="btnQuit" class="ghost">Quit (see ya!)</button>
          <button id="btnDone" class="primary">Done</button>
        </div>
      </section>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
