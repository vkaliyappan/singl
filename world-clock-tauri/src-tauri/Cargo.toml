[package]
name = "world-clock"
version = "1.0.0"
description = "World clock desktop widget"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
