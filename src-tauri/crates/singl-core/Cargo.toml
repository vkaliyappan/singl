[package]
name = "singl-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "singl application logic, with no Tauri dependency"
publish = false

[dependencies]
base64 = "0.22.1"
hex = "0.4.3"
rquickjs = { version = "0.14.0", features = ["futures"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "macros", "rt-multi-thread", "fs", "process", "io-util", "io-std", "time"] }
tokio-util = "0.7.20"
uuid = { version = "1.29.0", features = ["v4"] }
walkdir = "2.5.0"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
